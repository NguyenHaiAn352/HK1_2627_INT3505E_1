openapi: 3.0.0
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/none-6dd-3eb/Social-Network/1.0.0
info:
  description: This is a simple API
  version: "1.0.0"
  title: Social Network API
  contact:
    email: you@your-company.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'
tags:
  - name: admins
    description: Secured Admin-only calls
  - name: developers
    description: Operations available to regular developers
  - name: authentication
    description: Endpoints that authenticate users' identities and defines scopes
paths:
  /auth/login:
    post:
      tags:
        - authentication
      summary: Login
      operationId: authLogin
      description: Verify an user's login information and return authentication results. Requires username and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': 
          description: Authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': 
          description: Client sent too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/refresh:
    post:
      tags:
        - authentication
      summary: Renew refreshToken
      description:
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request body.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': 
          description: Authentication failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': 
          description: Client sent too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /posts/{id}:
    get:
      summary: returns a post by its Id
      description: Returns a post by its Id.
      operationId: postsGet
      security:
        - OAuth2:
          - posts.read
      parameters:
        - name: id
          in: path
          required: true
          description: Post identifier
          schema:
            type: integer
            minimum: 1
      responses:
        '200': 
          description: Retrieved the post successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: The post does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The client does not have an access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The client does not have the required scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The post does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429': 
          description: Client sent too many requests
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: /auth/login
          refreshUrl: /auth/refresh
          scopes:
            posts.read: Let user read a provided list of resources or a single resource
  schemas:
    Error:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
      example:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 8
        password:
          type: string
          minLength: 8
    TokenResponse:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: Refresh token used to obtain new access tokens
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        scope:
          type: string
          example: posts.read
    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token issued during login
    Post:
      type: object
      required:
        - id
        - title
        - content
      properties:
        id:
          type: integer
          example: 123
        title:
          type: string
          example: OpenAPI Best Practices
        content:
          type: string
          example: This post explains how to design APIs...
        author:
          type: string
          example: alice
        createdAt:
          type: string
          format: date-time