$kind: http-request
name: /books?strategy=cursor&cursor=5&limit=3
url: http://127.0.0.1:5000/books?strategy=cursor&cursor=5&limit=3
method: GET
queryParams:
  strategy: cursor
  cursor: "5"
  limit: "3"
scripts:
  - type: afterResponse
    code: "pm.test(\"Cursor pagination returns 3 books after cursor=5\", function ()
      {\r

      \    const data = pm.response.json();\r

      \    pm.expect(data.length).to.be.at.most(3);\r

      \    pm.expect(data[0].id).to.be.greaterThan(5);\r

      });"
    language: text/javascript
order: 9000
