$kind: http-request
name: /books?sort=-id
url: http://127.0.0.1:5000/books?sort=-id
method: GET
queryParams:
  - key: sort
    value: -id
    disabled: false
    description: |
      Sort the query descendingly if '-' is at the start of key.
scripts:
  - type: afterResponse
    code: "pm.test(\"Books are sorted by id descending\", function () {\r

      \    const data = pm.response.json();\r

      \    const ids = data.map(b => b.id);\r

      \    pm.expect(ids).to.eql([...ids].sort((a, b) => b - a));\r

      });\r\n"
    language: text/javascript
order: 6000
