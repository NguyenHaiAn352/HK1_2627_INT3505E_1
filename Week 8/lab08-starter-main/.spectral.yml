extends: ["spectral:oas"]

rules:
  operation-description: off
  operation-tags: off
  info-contact: off

  response-204-no-body:
    description: "Response with status code 204 must not contain any body"
    message: "This 204 response contains body and needs to be removed."
    severity: error
    given: $.path..responses['204']
    then:
      field: content
      function: falsy
